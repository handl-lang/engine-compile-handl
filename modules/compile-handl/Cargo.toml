[package]
name = "handl-plugin-compile-handl"
version.workspace = true
edition.workspace = true
description = "Handl-to-Handl (Hughes arrow dialect) compiler (ADR-0114)."
license.workspace = true
repository.workspace = true

[dependencies]
handl-plugin-compile = { git = "https://github.com/handl-lang/platform", branch = "main" }
