[package]
name = "handl-plugin-compile-handl"
version.workspace = true
edition.workspace = true
description = "Handl-to-Handl (Hughes arrow dialect) compiler (ADR-0114)."
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["handl", "compiler", "arrow-calculus"]
categories = ["compilers"]

[dependencies]
handl-plugin-compile = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-arrow-lower = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"
hnl-tool-codegen = { git = "https://github.com/handl-lang/tool-codegen", branch = "main", features = ["handl-term"] }

[dev-dependencies]
handl-kit-data-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse = { git = "https://github.com/handl-lang/tool-parse", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }